name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: Bouquine-mac-arm64
            build_script: build:mac-arm
          - os: macos-15
            artifact_name: Bouquine-mac-x64
            build_script: build:mac-intel
          - os: windows-latest
            artifact_name: Bouquine-win
            build_script: build:win
          - os: ubuntu-latest
            artifact_name: Bouquine-linux
            build_script: build:linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        # This is the "Magic Command" that replaces electron-rebuild
        run: npx electron-builder install-app-deps

      - name: Fix Linux permissions
        if: matrix.os == 'ubuntu-latest'
        run: |
          find ./node_modules/app-builder-bin -type f -name "app-builder" -exec chmod +x {} +
          mkdir -p build

      - name: Build and package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # We specify the shell explicitly for Windows compatibility
        shell: bash
        run: npm run ${{ matrix.build_script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/Bouquine*.dmg
            dist/Bouquine*.exe
            dist/Bouquine*.AppImage
          if-no-files-found: error

  finalize-release:
    name: Create GitHub Release
    needs: release-build
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            artifacts/**/Bouquine*.dmg
            artifacts/**/Bouquine*.exe
            artifacts/**/Bouquine*.AppImage
