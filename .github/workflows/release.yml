name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: Bouquine-mac-arm64
            build_script: build:mac
            arch: arm64
          - os: macos-13 # Standard GitHub runner for Intel (x64) Macs
            artifact_name: Bouquine-mac-x64
            build_script: build:mac
            arch: x64
          - os: windows-latest
            artifact_name: Bouquine-win
            build_script: build:win
          - os: ubuntu-latest
            artifact_name: Bouquine-linux
            build_script: build:linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-v1-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-v1-

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Fix Linux permissions
        if: matrix.os == 'ubuntu-latest'
        run: |
          find ./node_modules/app-builder-bin -type f -name "app-builder" -exec chmod +x {} +
          mkdir -p build

      - name: Build and package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ matrix.os }}" == macos* ]] && [ -n "${{ matrix.arch }}" ]; then
            echo "Building for macOS ${{ matrix.arch }}"
            npm run build && npx electron-builder --mac --${{ matrix.arch }}
          else
            npm run ${{ matrix.build_script }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  create-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          # This filter ensures only the installers are uploaded, preventing conflicts
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.AppImage
