name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            artifact_name: Bouquine-mac
            build_script: build:mac
          - os: windows-latest
            artifact_name: Bouquine-win
            build_script: build:win
          - os: ubuntu-latest
            artifact_name: Bouquine-linux
            build_script: build:linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Electron and Electron Builder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Install Linux dependencies (ImageMagick)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Fix permissions and setup Linux icons
        run: |
          mkdir -p build
          
          # Linux-specific setup
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            # Fix execution permissions for app-builder
            chmod +x ./node_modules/app-builder-bin/linux/x64/app-builder
            
            # Ensure Linux PNG icons exist (create from existing icon.png if needed)
            if [ -f "build/icon.png" ]; then
              echo "Linux icon.png exists, creating standard sizes..."
              # Create standard Linux icon sizes from the existing icon.png
              convert build/icon.png -resize 16x16 build/16x16.png
              convert build/icon.png -resize 32x32 build/32x32.png
              convert build/icon.png -resize 48x48 build/48x48.png
              convert build/icon.png -resize 64x64 build/64x64.png
              convert build/icon.png -resize 128x128 build/128x128.png
              convert build/icon.png -resize 256x256 build/256x256.png
              convert build/icon.png -resize 512x512 build/512x512.png
            else
              echo "WARNING: Linux icon.png not found in build directory"
            fi
          fi

      - name: Build and package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ${{ matrix.build_script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: error

  create-release:
    needs: release
    runs-on: ubuntu-latest
    # NEW: This line ensures the release is created even if one platform (like Linux) fails
    if: always() && contains(needs.release.result, 'success') 
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          # This glob pattern will pick up whatever was successfully built
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.blockmap
            artifacts/**/*.yml
