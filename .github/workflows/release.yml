name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  mac-arm64:
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: macos-arm64-electron-v1-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            macos-arm64-electron-v1-

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Build and package (ARM64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:mac-arm

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bouquine-mac-arm64
          path: |
            dist/Bouquine*.dmg
          if-no-files-found: error

  mac-x64:
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: macos-x64-electron-v1-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            macos-x64-electron-v1-

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Build and package (x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:mac-intel

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bouquine-mac-x64
          path: |
            dist/Bouquine*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: windows-electron-v1-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            windows-electron-v1-

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Build and package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bouquine-win
          path: |
            dist/Bouquine*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: linux-electron-v1-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            linux-electron-v1-

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Fix Linux permissions
        run: |
          find ./node_modules/app-builder-bin -type f -name "app-builder" -exec chmod +x {} +
          mkdir -p build

      - name: Build and package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bouquine-linux
          path: |
            dist/Bouquine*.AppImage
          if-no-files-found: error

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-v1-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-v1-

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Fix Linux permissions
        if: matrix.os == 'ubuntu-latest'
        run: |
          find ./node_modules/app-builder-bin -type f -name "app-builder" -exec chmod +x {} +
          mkdir -p build

      - name: Build and package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ${{ matrix.build_script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/Bouquine*.dmg
            dist/Bouquine*.exe
            dist/Bouquine*.AppImage
          if-no-files-found: error

  create-release:
    needs: [mac-arm64, mac-x64, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            artifacts/**/Bouquine*.dmg
            artifacts/**/Bouquine*.exe
            artifacts/**/Bouquine*.AppImage
